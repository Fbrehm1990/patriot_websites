<style>
:root{
  --bg:#080e1a; --bg2:#0d1526; --bg3:#131d33;
  --amber:#f59e0b; --amber2:#fbbf24;
  --slate:#8b9bb4; --white:#f0f4fa;
  --line:#1a2740; --green:#10b981;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg); color:var(--white);
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:24px;
}
.card{
  max-width:520px; padding:48px 40px;
  background:var(--bg2); border:1px solid var(--line); border-radius:20px;
}
.check{
  width:64px; height:64px; border-radius:50%;
  background:rgba(16,185,129,.12); border:1px solid var(--green);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 24px; font-size:28px; color:var(--green);
}
h1{
  font-family:'Fraunces',serif; font-weight:700; font-size:28px;
  margin-bottom:14px;
}
p{ color:var(--slate); font-size:15.5px; line-height:1.65; margin-bottom:28px; }
a.btn{
  display:inline-block; background:var(--amber); color:#080e1a;
  font-weight:700; padding:14px 28px; border-radius:10px;
  text-decoration:none; font-size:14.5px;
}

/* ── SITE THEME (matches home page) ── */
.flag-bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
.flag-bg img{width:100%;height:100%;object-fit:cover;object-position:center;}
.brand-flag{width:30px;height:auto;flex-shrink:0;border-radius:2px;box-shadow:0 0 0 1px rgba(14,27,51,0.12);}

body{background:#0e1b33;position:relative;}
body::after{content:"";position:fixed;inset:0;background:rgba(8,14,26,0.55);z-index:0;pointer-events:none;}
.card{position:relative;z-index:1;background:#ffffff;border:none;color:#0e1b33;box-shadow:0 24px 60px rgba(0,0,0,0.35);}
.site-logo{display:inline-flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#0e1b33;text-decoration:none;margin-bottom:22px;}
.site-logo em{color:#b22234;font-style:italic;}
h1{color:#0e1b33;}
p{color:#4a5568;}
a.btn{background:#0e1b33;color:#ffffff;}
a.btn:hover{background:#1b2d52;}
</style>
